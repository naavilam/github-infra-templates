name: Manager Update Website
run-name: Manager Update Website

on:
  workflow_call:
    inputs:
      org:
        description: "Target organization"
        required: true
        type: string
        default: ""
    secrets:
      PROVISIONER_APP_ID:
        required: true
      PROVISIONER_PRIVATE_KEY_PEM:
        required: true

  workflow_dispatch:
    inputs:
      org:
        description: "Target organization (leave empty to rebuild ALL from orgs.yml)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: manager-site
  cancel-in-progress: true

env:
  CENTRAL_REPO: naavilam/github-infra-templates
  TEMPLATE_REF: main
  MAX_PARALLEL: "6"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count:  ${{ steps.set.outputs.count }}
    steps:
      - name: Checkout templates (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Checkout central (orgs.yml only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.TEMPLATE_REF }}
          path: templates
          sparse-checkout: |
            orgs.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - id: set
        name: Build org matrix
        shell: bash
        env:
          ORG_INPUT: ${{ inputs.org || github.event.inputs.org }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import os, json, yaml
          from pathlib import Path

          org_input = (os.environ.get("ORG_INPUT") or "").strip()
          orgs_yml = Path("templates/orgs.yml")

          if not orgs_yml.exists():
              raise SystemExit(f"::error::orgs.yml not found at {orgs_yml} (checkout central failed?)")

          data = yaml.safe_load(orgs_yml.read_text(encoding="utf-8")) or {}
          if isinstance(data, list):
              items = data
          elif isinstance(data, dict):
              items = data.get("orgs") or data.get("organizations") or data.get("items") or []
              if not isinstance(items, list):
                  items = []
          else:
              items = []

          selected = []
          for it in items:
              if not isinstance(it, dict):
                  continue
              org = str(it.get("name","")).strip()
              slug = str(it.get("slug","")).strip()
              if not org:
                  continue
              if not slug:
                  slug = org.lower()
              selected.append({"org": org, "slug": slug.lower()})

          if org_input:
              selected = [x for x in selected if x["org"].lower() == org_input.lower()]
              if not selected:
                  raise SystemExit(f"::error::org '{org_input}' not found in orgs.yml")

          matrix = {"include": selected}
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix, ensure_ascii=False)}\n")
              f.write(f"count={len(selected)}\n")

          print(f"[ok] orgs_selected={len(selected)}")
          PY

  rebuild:
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    environment: ${{ matrix.org }}

    env:
      ORG:  ${{ matrix.org }}
      SLUG: ${{ matrix.slug }}

    steps:
      - name: Ensure gh is available
        run: gh --version

      - name: Create Provisioner installation token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROVISIONER_APP_ID }}
          private-key: ${{ secrets.PROVISIONER_PRIVATE_KEY_PEM }}
          owner: ${{ matrix.org }}

      - name: Export GH_TOKEN for rest of job (no leak)
        shell: bash
        run: |
          set -euo pipefail
          tok='${{ steps.app_token.outputs.token }}'
          [[ "${#tok}" -ge 20 ]]
          echo "GH_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Sanity check auth
        shell: bash
        run: |
          set -euo pipefail
          gh auth status

      - name: Checkout templates repo (central)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.TEMPLATE_REF }}
          path: templates
          fetch-depth: 1

      - name: Assemble website payload
        shell: bash
        env:
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          : "${ORG:?ORG is required}"

          WS="$GITHUB_WORKSPACE"
          ROOT="$WS/templates"
          OUT="$WS/out"

          rm -rf "$OUT"
          mkdir -p "$OUT/_posts"

          rsync -a --delete \
            "$ROOT/manager/manager_website/" \
            "$OUT/"

          ORG_SLUG="$(echo "$ORG" | tr '[:upper:]' '[:lower:]')"
          ASSETS_DIR="$ROOT/manager/manager_assets/${ORG_SLUG}"

          if [[ ! -d "$ASSETS_DIR" ]]; then
            echo "Missing assets dir: $ASSETS_DIR" >&2
            echo "Available assets:" >&2
            ls -la "$ROOT/manager/manager_assets" >&2 || true
            exit 1
          fi

          rsync -a "$ASSETS_DIR/" "$OUT/"

          mkdir -p "$OUT/.github/workflows"
          rsync -a --delete \
            "$ROOT/manager/manager_workflows/" \
            "$OUT/.github/workflows/"

          echo "Payload assembled at: $OUT"

      - name: Install python deps for assembly
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate _posts from registry
        shell: bash
        env:
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          ORG_SLUG="$(echo "$ORG" | tr '[:upper:]' '[:lower:]')"
          REG="$GITHUB_WORKSPACE/templates/org/org_registry/${ORG_SLUG}-registry.yml"
          OUTPOSTS="$GITHUB_WORKSPACE/out/_posts"
          SCRIPT="$GITHUB_WORKSPACE/templates/manager/manager_scripts/assembly_posts.py"

          [[ -f "$SCRIPT" ]] || (echo "Missing script: $SCRIPT" >&2; exit 1)
          [[ -f "$REG" ]] || (echo "Missing registry: $REG" >&2; exit 1)

          python "$SCRIPT" \
            --registry "$REG" \
            --out-posts "$OUTPOSTS"

      - name: Write site URL to README.md
        shell: bash
        env:
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          ORG_LC="$(echo "$ORG" | tr '[:upper:]' '[:lower:]')"
          echo "https://${ORG_LC}.github.io" > "$GITHUB_WORKSPACE/out/README.md"

      - name: Inject GA + title + url + utm_source + hero_image into out/_config.yml
        shell: bash
        env:
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, yaml
          from pathlib import Path

          org = (os.environ.get("ORG") or "").strip()
          if not org:
              raise SystemExit("ORG env is required")

          ws  = os.environ["GITHUB_WORKSPACE"]
          org_lc = org.lower()

          orgs_yml   = Path(ws) / "templates" / "orgs.yml"
          config_yml = Path(ws) / "out" / "_config.yml"
          out_dir    = Path(ws) / "out"

          data = yaml.safe_load(orgs_yml.read_text(encoding="utf-8")) or {}
          if isinstance(data, list):
              items = data
          elif isinstance(data, dict):
              items = data.get("orgs") or data.get("organizations") or data.get("items") or []
              if not isinstance(items, list):
                  items = []
          else:
              items = []

          entry = next(
              (x for x in items
               if isinstance(x, dict) and str(x.get("name","")).strip().lower() == org_lc),
              None
          )
          if not entry:
              raise SystemExit(f"ORG not found in orgs.yml: {org}")

          ga_id = (entry.get("ga_analytics") or entry.get("GA_ID") or entry.get("ga_id") or "").strip()
          title = (entry.get("title") or "").strip()
          url   = f"https://{org_lc}.github.io"
          github_url = f"https://github.com/{org_lc}/{org_lc}.github.io"

          cfg = yaml.safe_load(config_yml.read_text(encoding="utf-8")) or {}

          cfg["org"] = org_lc
          cfg["utm_source"] = org_lc
          cfg["url"] = url
          cfg["github_url"] = github_url

          if ga_id:
              cfg["ga_tracking_id"] = ga_id
          else:
              cfg.pop("ga_tracking_id", None)

          if title:
              cfg["title"] = title

          # ---------- hero_image autodetect ----------
          img_dir = out_dir / "img"
          candidates = []

          if img_dir.exists():
              for p in img_dir.rglob("*"):
                  if not p.is_file():
                      continue
                  name = p.name.lower()
                  if "banner" not in name:
                      continue
                  if p.suffix.lower() not in (".png", ".jpg", ".jpeg", ".webp"):
                      continue
                  candidates.append(p)

          def ext_rank(ext: str) -> int:
              return {".png": 0, ".jpg": 1, ".jpeg": 2, ".webp": 3}.get(ext, 9)

          best = None
          if candidates:
              candidates.sort(key=lambda p: (
                  0 if "hero-banner" in p.name.lower() else 1,
                  ext_rank(p.suffix.lower()),
                  p.name.lower(),
              ))
              best = candidates[0]

          if best:
              rel = best.relative_to(out_dir).as_posix()   # ex: "img/hero-banner.png"
              cfg["hero_image"] = "/" + rel                # ex: "/img/hero-banner.png"
              print(f"[ok] hero_image = {cfg['hero_image']}")
          else:
              cfg.pop("hero_image", None)
              print("[warn] no banner image found under out/img/ (hero_image removed)")

          yaml.safe_dump(
              cfg,
              open(config_yml, "w", encoding="utf-8"),
              sort_keys=False,
              allow_unicode=True,
          )
          print("[ok] _config.yml updated")
          PY

      - name: Push content to {org}.github.io (site-only)
        shell: bash
        env:
          ORG:  ${{ matrix.org }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail

          ORG_LC="$(echo "$ORG" | tr '[:upper:]' '[:lower:]')"
          REPO="${ORG_LC}.github.io"
          FULL="${ORG_LC}/${REPO}"

          gh api "repos/${FULL}" -q '.full_name' >/dev/null

          SLUG_LC="$(echo "${SLUG}" | tr '[:upper:]' '[:lower:]')"
          BOT="${SLUG_LC}-provisioner-app[bot]"
          git config --global user.name  "${BOT}"
          git config --global user.email "${BOT}@users.noreply.github.com"

          rm -rf target
          mkdir -p target
          cd target

          git init
          git branch -M main

          rsync -a "$GITHUB_WORKSPACE/out/" .

          git add -A
          git commit -m "Update files" || echo "Nothing to commit."

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${FULL}.git"
          git push -u origin main --force

      - name: Ensure GitHub Pages enabled (best-effort)
        shell: bash
        env:
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          ORG_LC="$(echo "$ORG" | tr '[:upper:]' '[:lower:]')"
          REPO="${ORG_LC}.github.io"
          gh api "repos/${ORG_LC}/${REPO}/pages" -X POST \
            -f source[branch]=main \
            -f source[path]="/" >/dev/null 2>&1 || true