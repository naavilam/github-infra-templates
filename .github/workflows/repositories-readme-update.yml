name: Update org READMEs

on:
  workflow_call:
    inputs:
      repo:
        description: "Target repository or else all."
        required: false
        type: string
        default: ""
    secrets:
      PROVISIONER_APP_ID:
        required: true
      PROVISIONER_PRIVATE_KEY_PEM:
        required: true

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

env:
  CENTRAL_REPO: naavilam/github-infra-templates
  TEMPLATE_REF: main
  MAX_PARALLEL: "10"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count:  ${{ steps.set.outputs.count }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Mint Provisioner GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROVISIONER_APP_ID }}
          private-key: ${{ secrets.PROVISIONER_PRIVATE_KEY_PEM }}
          owner: ${{ github.repository_owner }}

      - name: Checkout central (registry only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.TEMPLATE_REF }}
          token: ${{ steps.app-token.outputs.token }}
          path: central
          sparse-checkout: |
            org/org_registry
            orgs.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - id: set
        name: Build matrix from CENTRAL org registry (with embedded cfg)
        shell: bash
        env:
          ORG: ${{ github.repository_owner }}
          REPO_FILTER: ${{ inputs.repo }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          org_lc="$(echo "$ORG" | tr '[:upper:]' '[:lower:]')"
          reg_path_local="central/org/org_registry/${org_lc}-registry.yml"
          orgs_path_local="central/orgs.yml"
          export ORGS_PATH_LOCAL="${orgs_path_local}"

          echo "ORG='${ORG}' (org_lc='${org_lc}')"
          echo "REPO_FILTER='${REPO_FILTER}'"
          echo "REGISTRY_LOCAL='${reg_path_local}'"
          echo "ORGS_YML_LOCAL='${orgs_path_local}'"

          python - <<'PY'
          import os, sys, json, base64
          import yaml

          def load_org_ga_id(org_name: str) -> str:
              path = os.environ.get("ORGS_PATH_LOCAL", "central/orgs.yml")
              try:
                  data = yaml.safe_load(open(path, "r", encoding="utf-8")) or {}
              except FileNotFoundError:
                  print(f"::warning::orgs.yml not found at {path}")
                  return ""
              except Exception as e:
                  print(f"::warning::failed to read orgs.yml at {path}: {e}")
                  return ""

              if isinstance(data, list):
                  items = data
              elif isinstance(data, dict):
                  items = data.get("orgs") or data.get("organizations") or data.get("items") or []
                  if not isinstance(items, list):
                      items = []
              else:
                  items = []

              org_lc = (org_name or "").strip().lower()
              for it in items:
                  if not isinstance(it, dict):
                      continue
                  name = str(it.get("name", "")).strip().lower()
                  if name == org_lc:
                      return (it.get("ga_analytics") or it.get("GA_ID") or it.get("ga_id") or "").strip()
              return ""

          org = (os.environ.get("ORG") or "").strip()
          if not org:
              raise SystemExit("::error::ORG env is required")

          repo_filter = (os.environ.get("REPO_FILTER") or "").strip()
          org_lc = org.lower()

          reg_path_local = f"central/org/org_registry/{org_lc}-registry.yml"
          raw = open(reg_path_local, "r", encoding="utf-8").read()
          data = yaml.safe_load(raw) or {}
          items = data.get("repos", [])
          if not isinstance(items, list):
              items = []

          ga_id = load_org_ga_id(org)

          def norm(s: str) -> str:
              return (s or "").strip().lower()

          def slug_repo(name: str) -> str:
              s = (name or "").strip()
              s = s.replace("(", "-").replace(")", "-")
              return s

          include = []
          for it in items:
              if not isinstance(it, dict):
                  continue

              raw_name = str(it.get("name", "")).strip()
              if not raw_name:
                  continue

              name = slug_repo(raw_name)
              full = f"{org_lc}/{name}"

              if repo_filter:
                  rf = repo_filter.strip()
                  if "/" in rf:
                      if norm(full) != norm(rf):
                          continue
                  else:
                      if norm(name) != norm(rf) and norm(raw_name) != norm(rf) and norm(slug_repo(rf)) != norm(name):
                          continue

              course_id = (it.get("id") or "").strip() or name
              title = (it.get("title") or "").strip() or name.replace("-", " ")
              area  = (it.get("academic_area") or "").strip()
              raw_level = (it.get("academic_level") or "").strip().lower()

              LEVEL_MAP = {"undergraduate": "Undergraduate Course", "graduate": "Graduate Course"}
              level = LEVEL_MAP.get(raw_level, raw_level)

              tagline = (it.get("readme_tagline") or "").strip()
              if not tagline:
                  parts = [p for p in [area, level] if p]
                  tagline = " • ".join(parts) if parts else "lectures • notebooks • references"

              site_url = (it.get("site_url") or "").strip() or f"https://{org_lc}.github.io/{name}"

              cfg = {
                  "TITLE_1": course_id,
                  "TITLE_2": title,
                  "REPO_TAGLINE": tagline,
                  "CTA_TEXT": (it.get("readme_cta_text") or "Access the full course website").strip(),
                  "THEME": (it.get("readme_theme") or "coding").strip(),
                  "SITE_URL": site_url,
                  "ASSETS_DIR": (it.get("readme_assets_dir") or ".github/readme").strip(),
                  "HERO_FILE": (it.get("site_hero_image") or "").strip(),
                  "GA_ID": ga_id,
                  "REPO": name
              }
              cfg = {k: v for k, v in cfg.items() if v}

              payload = json.dumps(cfg, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              cfg_b64 = base64.urlsafe_b64encode(payload).decode("ascii")
              include.append({"repo": full, "cfg_b64": cfg_b64})

          matrix = {"include": include}
          out_path = os.environ["GITHUB_OUTPUT"]
          with open(out_path, "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix, ensure_ascii=False)}\n")
              f.write(f"count={len(include)}\n")

          print(f"[ok] selected={len(include)}")
          PY

  apply:
    needs: plan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:          
      - name: Mint Provisioner GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROVISIONER_APP_ID }}
          private-key: ${{ secrets.PROVISIONER_PRIVATE_KEY_PEM }}
          owner: ${{ github.repository_owner }}

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Checkout central templates + scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.TEMPLATE_REF }}
          path: central
          sparse-checkout: |
            bootstrap/repo_readme
            bootstrap/repo_scripts/build_readme.py
          sparse-checkout-cone-mode: false


      - name: Debug matrix item (safe)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== matrix item ==="
          echo "matrix.repo=${{ matrix.repo }}"
          echo "workspace=${{ github.workspace }}"
          echo "pwd=$(pwd)"
          echo ""

      - name: Debug filesystem (safe)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== tree (top) ==="
          ls -la
          echo ""
          echo "=== tree (target) ==="
          ls -la target || true
          echo ""
          echo "=== tree (target/.github) ==="
          ls -la target/.github || true
          echo ""
          echo "=== tree (target/.github/readme) ==="
          ls -la target/.github/readme || true
          echo ""

      # se você está gerando _cfg/readme.yml a partir de base64/JSON/YAML do registry,
      # garanta que ele existe e MOSTRE o conteúdo (isso é safe).
      - name: Debug cfg file (safe)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== cfg ==="
          ls -la _cfg || true
          if [[ -f "_cfg/readme.yml" ]]; then
            echo "--- _cfg/readme.yml ---"
            cat _cfg/readme.yml
            echo "------------------------"
          else
            echo "::warning::_cfg/readme.yml not found"
          fi
          echo ""

      - name: Debug before build (git + repo state) (safe)
        shell: bash
        run: |
          set -euo pipefail
          cd target
          echo "=== target git state (before) ==="
          echo "repo=$(git remote get-url origin || true)"
          echo "branch=$(git rev-parse --abbrev-ref HEAD || true)"
          echo "head=$(git rev-parse --short HEAD || true)"
          echo ""
          echo "--- status --porcelain ---"
          git status --porcelain=v1 || true
          echo ""
          echo "--- ls ---"
          ls -la
          echo ""
          echo "--- has README.md? ---"
          if [[ -f README.md ]]; then echo "yes"; else echo "no"; fi
          echo ""

      - name: Write cfg file (from matrix, local workspace)
        shell: bash
        env:
          CFG_B64: ${{ matrix.cfg_b64 }}
        run: |
          set -euo pipefail
          mkdir -p _cfg
          python - <<'PY'
          import os, base64, json, yaml
          data = base64.b64decode(os.environ["CFG_B64"]).decode("utf-8")
          cfg = json.loads(data)  # se você guardar JSON no registry
          with open("_cfg/readme.yml", "w", encoding="utf-8") as f:
            yaml.safe_dump(cfg, f, sort_keys=False, allow_unicode=True)
          print("[ok] wrote _cfg/readme.yml")
          PY

      - name: Build README (from central + cfg)
        shell: bash
        run: |
          set -euo pipefail

          python central/bootstrap/repo_scripts/build_readme.py \
            --repo target \
            --central central/bootstrap/repo_readme \
            --cfg _cfg/readme.yml

      - name: Debug after build (what changed?) (safe)
        shell: bash
        run: |
          set -euo pipefail
          cd target
          echo "=== target git state (after) ==="
          echo "--- status --porcelain ---"
          git status --porcelain=v1 || true
          echo ""
          echo "--- diff --name-status ---"
          git diff --name-status || true
          echo ""
          echo "--- diffstat ---"
          git diff --stat || true
          echo ""
          echo "--- show README head (if exists) ---"
          if [[ -f README.md ]]; then
            head -n 40 README.md
          else
            echo "::warning::README.md still not present"
          fi
          echo ""
          echo "--- list .github/readme (if exists) ---"
          ls -la .github/readme || true
          echo ""


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Write _cfg/readme.yml from matrix payload
        shell: bash
        env:
          CFG_B64: ${{ matrix.cfg_b64 }}
        run: |
          set -euo pipefail
          mkdir -p _cfg
          python - <<'PY'
          import os, json, base64, yaml
          b64 = os.environ["CFG_B64"]
          data = base64.urlsafe_b64decode(b64.encode("ascii")).decode("utf-8")
          cfg = json.loads(data)
          with open("_cfg/readme.yml", "w", encoding="utf-8") as f:
            yaml.safe_dump(cfg, f, sort_keys=False, allow_unicode=True)
          print("[ok] wrote _cfg/readme.yml")
          PY

      - name: Build + commit + push
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ matrix.repo }}          # ex: academic-codex/XYZ
        run: |
          set -euo pipefail

          python central/bootstrap/repo_scripts/build_readme.py \
            --repo target \
            --central central/bootstrap/repo_readme \
            --repo-cfg _cfg/readme.yml

          cd target

          # identidade do bot (org do manager atual)
          ORG_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          BOT="${ORG_LC}-provisioner-app[bot]"
          git config user.name "${BOT}"
          git config user.email "${BOT}@users.noreply.github.com"

          # 🔒 garante push autenticado + sem redirect/rename surprises
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          # opcional: evita prompts mesmo se algo tentar pedir credencial
          git config --global credential.helper ""
          git config --global core.askPass "true"

          git add README.md .github/readme || true

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update files"

          # empurra explicitamente pro branch atual
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          git push origin "${BRANCH}"