run-name: Notify Managers Website Update

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Target organization (leave empty = ALL existing manager sites)"
        required: false
        type: string
        default: ""

  push:
    branches: [ main ]
    paths:
      - "manager/manager_website/**"
      - "manager/manager_assets/**"
      - "manager/manager_scripts/**"
      - "manager/manager_workflows/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: notify-managers
  cancel-in-progress: true

env:
  CENTRAL_REPO: naavilam/github-infra-templates
  TEMPLATE_REF: main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count:  ${{ steps.build.outputs.count }}

    steps:
      - name: Checkout orgs.yml
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.TEMPLATE_REF }}
          path: templates
          sparse-checkout: |
            orgs.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml requests

      - id: build
        name: Build matrix of EXISTING manager repos
        env:
          ORG_INPUT: ${{ inputs.org }}
        run: |
          python - <<'PY'
          import json, os, yaml, requests
          from pathlib import Path

          org_input = (os.environ.get("ORG_INPUT") or "").strip().lower()

          data = yaml.safe_load(Path("templates/orgs.yml").read_text(encoding="utf-8")) or {}
          items = data.get("orgs", []) if isinstance(data, dict) else (data or [])

          found = []

          for it in items:
              if not isinstance(it, dict):
                  continue
              org = str(it.get("name", "")).strip()
              if not org:
                  continue

              if org_input and org.lower() != org_input:
                  continue

              # Public existence check (no auth): repo {org}/{org}.github.io
              url = f"https://api.github.com/repos/{org}/{org}.github.io"
              r = requests.get(url, timeout=15)

              print(f"🔍 {org}: {r.status_code}")

              if r.status_code == 200:
                  found.append({"org": org})

          matrix = {"include": found}

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"count={len(found)}\n")

          print(f"[ok] manager sites found = {len(found)}")
          PY

  notify:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    env:
      ORG: ${{ matrix.org }}

    steps:
      - name: Ensure gh is available
        run: gh --version

      - name: Mint templates-provisioner-app token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ vars.ROOT_PROVISIONER_APP_ID }}
          private-key: ${{ secrets.ROOT_PROVISIONER_PRIVATE_KEY_PEM }}
          owner:       ${{ matrix.org }}

      - name: Export GH_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          tok='${{ steps.app_token.outputs.token }}'
          [[ "${#tok}" -ge 20 ]]
          echo "GH_TOKEN=$tok" >> "$GITHUB_ENV"

      # Debug + robust dispatch:
      # 1) discover default branch
      # 2) find workflow_id by workflow path
      # 3) dispatch by workflow_id (NOT by "name")
      - name: Dispatch listener-manager-website-update (robust)
        shell: bash
        run: |
          set -euo pipefail
          FULL="${ORG}/${ORG}.github.io"

          echo "Repo: $FULL"

          DEFAULT_BRANCH="$(gh api "repos/$FULL" -q '.default_branch')"
          echo "default_branch=$DEFAULT_BRANCH"

          echo "Workflows in repo (name + path):"
          gh api "repos/$FULL/actions/workflows" -q '.workflows[] | [.name,.path] | @tsv'

          WF_PATH=".github/workflows/listener-manager-website-update.yml"
          WF_ID="$(gh api "repos/$FULL/actions/workflows" -q ".workflows[] | select(.path==\"$WF_PATH\") | .id" | head -n 1)"

          if [[ -z "${WF_ID:-}" ]]; then
            echo "FATAL: workflow not found at path: $WF_PATH" >&2
            exit 1
          fi

          echo "Dispatching workflow_id=$WF_ID on ref=$DEFAULT_BRANCH"
          gh api "repos/$FULL/actions/workflows/$WF_ID/dispatches" \
            -X POST \
            -f ref="$DEFAULT_BRANCH"