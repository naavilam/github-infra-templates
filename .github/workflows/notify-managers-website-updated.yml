name: Notify Managers Website Update

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Target organization (leave empty = ALL existing manager sites)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: notify-managers
  cancel-in-progress: true

env:
  CENTRAL_REPO: naavilam/github-infra-templates
  TEMPLATE_REF: main

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count:  ${{ steps.build.outputs.count }}

    steps:
      - name: Checkout orgs.yml
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.TEMPLATE_REF }}
          path: templates
          sparse-checkout: |
            orgs.yml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml requests

      - id: build
        name: Build matrix of EXISTING manager repos
        env:
          ORG_INPUT: ${{ inputs.org }}
        run: |
          python - <<'PY'
          import json, os, yaml, requests
          from pathlib import Path

          org_input = (os.environ.get("ORG_INPUT") or "").strip().lower()

          data = yaml.safe_load(Path("templates/orgs.yml").read_text())
          found = []

          for it in data.get("orgs", []):
              org = it.get("name", "").strip()
              if not org:
                  continue

              if org_input and org.lower() != org_input:
                  continue

              url = f"https://api.github.com/repos/{org}/{org}.github.io"
              r = requests.get(url, timeout=10)

              print(f"🔍 {org}: {r.status_code}")

              if r.status_code == 200:
                  found.append({"org": org})

          matrix = {"include": found}

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"count={len(found)}\n")

          print(f"[ok] manager sites found = {len(found)}")
          PY

  notify:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    env:
      ORG: ${{ matrix.org }}

    steps:
      - name: Mint templates-provisioner-app token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ vars.ROOT_PROVISIONER_APP_ID }}
          private-key: ${{ secrets.ROOT_PROVISIONER_PRIVATE_KEY_PEM }}
          owner:       ${{ matrix.org }}

      - name: Export GH_TOKEN
        run: |
          echo "GH_TOKEN=${{ steps.app_token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Dispatch manager-website-update
        run: |
          set -euo pipefail
          gh api \
            "repos/${ORG}/${ORG}.github.io/actions/workflows/listener-manager-website-update.yml/dispatches" \
            -X POST \
            -f ref=main \
            -f inputs[org]="$ORG"