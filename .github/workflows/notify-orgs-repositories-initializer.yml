name: Notify Managers -> Repositories Initializer

on:
  workflow_dispatch:

  push:
    branches: [ main ]
    paths:
      - "org/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: notify-managers-repo-initializer
  cancel-in-progress: true

env:
  CENTRAL_REPO: naavilam/github-infra-templates
  TEMPLATE_REF: main

  LISTENER_WORKFLOW_PATH: ".github/workflows/listener-repositories-initializer.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count:  ${{ steps.build.outputs.count }}

    steps:
      - name: Checkout orgs.yml (central)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.TEMPLATE_REF }}
          path: templates
          sparse-checkout: |
            orgs.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyyaml requests

      - id: build
        name: Build matrix of EXISTING manager repos (ALL orgs)
        run: |
          python - <<'PY'
          import json, yaml, requests
          from pathlib import Path

          orgs_yml = Path("templates/orgs.yml")
          data = yaml.safe_load(orgs_yml.read_text(encoding="utf-8")) or {}
          items = data.get("orgs", []) if isinstance(data, dict) else (data or [])

          found = []
          tested = 0

          for it in items:
              if not isinstance(it, dict):
                  continue
              org = str(it.get("name", "")).strip()
              if not org:
                  continue

              tested += 1
              url = f"https://api.github.com/repos/{org}/{org}.github.io"
              r = requests.get(
                  url,
                  timeout=15,
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "notify-managers"},
              )

              print(f"🔍 {org}: {r.status_code}")

              if r.status_code == 200:
                  found.append({"org": org})
              elif r.status_code == 404:
                  # repo manager ainda não existe -> ignora
                  pass
              else:
                  # se for rate limit/5xx etc, falha pra não ficar silencioso
                  raise SystemExit(f"::error::GitHub API unexpected status for {url}: HTTP {r.status_code}")

          matrix = {"include": found}

          out = Path(json.loads(json.dumps(str(Path().absolute()))))  # no-op pra evitar lint chato
          with open(str(Path().home() / "dummy"), "w") as _:
              pass

          import os
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"count={len(found)}\n")

          print(f"[summary] orgs tested = {tested}")
          print(f"[summary] manager repos found = {len(found)}")
          PY

  notify:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    env:
      ORG: ${{ matrix.org }}

    steps:
      - name: Ensure gh is available
        run: gh --version

      - name: Mint templates-provisioner-app token (ROOT) for target org
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ vars.ROOT_PROVISIONER_APP_ID }}
          private-key: ${{ secrets.ROOT_PROVISIONER_PRIVATE_KEY_PEM }}
          owner:       ${{ matrix.org }}

      - name: Export GH_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          tok='${{ steps.app_token.outputs.token }}'
          [[ "${#tok}" -ge 20 ]]
          echo "GH_TOKEN=$tok" >> "$GITHUB_ENV"

      - name: Dispatch listener workflow in manager repo (robust by path)
        shell: bash
        run: |
          set -euo pipefail

          FULL="${ORG}/${ORG}.github.io"
          echo "Repo: $FULL"

          DEFAULT_BRANCH="$(gh api "repos/$FULL" -q '.default_branch')"
          echo "default_branch=$DEFAULT_BRANCH"

          WF_PATH="${{ env.LISTENER_WORKFLOW_PATH }}"
          echo "Looking for workflow path: $WF_PATH"

          WF_ID="$(gh api "repos/$FULL/actions/workflows" -q ".workflows[] | select(.path==\"$WF_PATH\") | .id" | head -n 1)"

          if [[ -z "${WF_ID:-}" ]]; then
            echo "FATAL: workflow not found at path: $WF_PATH in $FULL" >&2
            echo "Available workflows (name | path):"
            gh api "repos/$FULL/actions/workflows" -q '.workflows[] | [.name,.path] | @tsv' || true
            exit 1
          fi

          echo "Dispatching workflow_id=$WF_ID ref=$DEFAULT_BRANCH"
          gh api "repos/$FULL/actions/workflows/$WF_ID/dispatches" \
            -X POST \
            -f ref="$DEFAULT_BRANCH"